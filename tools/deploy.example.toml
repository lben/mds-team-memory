# Copy to tools/deploy.toml, then edit both server sections. This is the only
# deployment configuration file; it is gitignored. Never put passwords here.
# Run .\Update.cmd [UAT|PROD] in PowerShell, or ./Update [UAT|PROD] on macOS/Linux.
# Default: UAT. Enter your server password once when prompted.
# Local Update/TestData launchers use system TLS certificates for uv downloads.
# Company Artifactory/proxy CA certificates must be installed on your PC;
# alternatively set SSL_CERT_FILE to an IT-provided PEM CA bundle.
# Linux server: RHEL 8.10 x86_64, SSH/SFTP, bash, tar, sha256sum, a writable
# local filesystem, and >= 14 GiB free for the first install. No sudo or
# internet is required; approved Python, uv, models and wheels are bundled.

[uat]
host = "deployer@192.0.2.10"              # SSH username@IP or DNS name
ssh_port = 22                            # SSH port (separate from app port)
root = "/home/deployer/apps/mds-uat"      # absolute directory, no spaces
port = 8000                              # application TCP port, reachable by your team
bind = "0.0.0.0"
uv = "bundled"                           # or absolute path to installed Linux uv
python = "bundled"                       # or absolute Python 3.12 binary, SQLite >= 3.51.3
bash = "bash"                            # or /bin/bash
keep_releases = 5
# host_key_sha256 = "SHA256:..."          # optional SSH host fingerprint supplied by IT
# First connection without this asks you to trust the displayed fingerprint;
# later connections reject changed keys automatically.

[prod]
host = "deployer@192.0.2.20"
ssh_port = 22
root = "/home/deployer/apps/mds-prod"      # use a distinct directory for each environment
port = 8000
bind = "0.0.0.0"
uv = "bundled"
python = "bundled"
bash = "bash"
keep_releases = 5
# host_key_sha256 = "SHA256:..."

# [prod.env]                              # optional application settings only
# MDS_SECURE_COOKIES = "1"                 # enable only behind HTTPS
# MDS_ML_LOAD_TIMEOUT_SECONDS = "300"      # Update default; finite cold model-load deadline
# Update manages data/model paths itself; do not set MDS_DATA_DIR,
# MDS_ML_ROOT or MDS_ML_GENERATION here.
# Deployment also manages MDS_ENVIRONMENT (uat/prod); never set it in target.env.
# After Update UAT: TestData.cmd [UAT] datasets|preview|add|batches|status|remove.
# See TESTDATA.md. PROD is refused by both client and deployed server.

# [local]
